<!doctype html>
<html lang="sw" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>ZANZIBAR SACCOS Platform | Mfumo wa Enterprise wa SACCOS & VICOBA</title>
    <meta name="description" content="Mfumo wa kisasa wa usimamizi wa SACCOS, VICOBA, Mikopo, Akiba, na Uhasibu." />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100dvh; min-height: 100vh; background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; padding: 16px; box-sizing: border-box;">
        <div style="width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #059669, #0d9488); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);">
          <div style="width: 28px; height: 28px; border: 3px solid #ffffff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </div>
        <div style="display: inline-block; padding: 3px 12px; border-radius: 9999px; background: rgba(5, 150, 105, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          ISACCOS &bull; ZANZIBAR SACCOS PLATFORM
        </div>
        <h1 style="font-size: clamp(20px, 5.5vw, 26px); font-weight: 900; margin: 0 0 8px 0; color: #ffffff; letter-spacing: -0.02em; padding: 0 8px;">
          ZANZIBAR SACCOS PLATFORM
        </h1>
        <p style="font-size: clamp(11px, 3.2vw, 13px); color: #94a3b8; margin: 0 0 20px 0; max-width: 380px; line-height: 1.5; padding: 0 12px;">
          Mfumo Mkuu wa Kidigitali wa SACCOS, VICOBA na Taasisi za Kifedha Zanzibar & Tanzania
        </p>
        <div style="width: min(220px, 70vw); height: 4px; background: #1e293b; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4); border-radius: 9999px; animation: progress 1.5s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
